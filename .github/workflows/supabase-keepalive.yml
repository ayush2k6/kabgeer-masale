name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (well within Supabase's 7-day inactivity pause window)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  keepalive:
    name: Ping Supabase Health & Query
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase database to maintain active status..."
          SUPABASE_URL="https://cfvopnzcqbtqcupdomto.supabase.co"
          ANON_KEY="sb_publishable_9Ry6OuD-80stD-4Cz8fMaQ_0EAHlUsU"
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1")
          
          echo "Supabase HTTP Response: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "✅ Supabase database is active, healthy, and warm!"
          else
            echo "⚠️ Non-200 response: $RESPONSE_CODE"
            exit 1
          fi
