name: Security CI & Regression Testing

on:
  push:
    branches: [main, v1-release]
  pull_request:
    branches: [main, v1-release]
  workflow_dispatch:

jobs:
  security-and-build:
    name: Security Scan, Build & Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Dependency Vulnerability Check
        run: |
          echo "Scanning production runtime dependencies for known CVEs..."
          npm audit --omit=dev --audit-level=high
          echo "✅ Production runtime dependencies passed security audit!"

      - name: Verify Clean Production Build
        run: |
          echo "Building production frontend bundle..."
          npm run build
          echo "✅ Vite production build succeeded!"

      - name: Run Urgent Security Regression Test Suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://cfvopnzcqbtqcupdomto.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_9Ry6OuD-80stD-4Cz8fMaQ_0EAHlUsU' }}
        run: |
          echo "Executing live security regression suite..."
          node security-tests/test-urgent-security-regression.mjs
          echo "✅ All security regression probes passed!"
