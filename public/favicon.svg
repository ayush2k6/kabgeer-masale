<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163A24"/>
      <stop offset="100%" stop-color="#0A1C11"/>
    </linearGradient>
    <linearGradient id="kgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D37A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>
    <linearGradient id="kgLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFE8A3"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#kgBg)"/>
  
  <!-- Subtle Royal Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#kgGold)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Top Spice Leaf / Royal Crown Accent -->
  <path d="M32 10 C35 15 40 17 38 21 C36 24 32 23 32 23 C32 23 28 24 26 21 C24 17 29 15 32 10 Z" fill="url(#kgLeaf)"/>
  <path d="M32 12 L32 21" stroke="#163A24" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Minimal Royal "K" Monogram -->
  <!-- Stem -->
  <rect x="20" y="22" width="5.5" height="28" rx="2" fill="url(#kgGold)"/>
  <!-- Top Diagonal Arm -->
  <path d="M25.5 35 L38.5 22.5 C39.8 21.2 42 22.1 42 24 C42 24.8 41.5 25.6 40.8 26.2 L29 37.5 Z" fill="url(#kgGold)"/>
  <!-- Bottom Diagonal Leg -->
  <path d="M27.5 34.5 L40.2 48.5 C41.2 49.6 42.8 50 44 50 L44.5 50 C45.6 50 46.2 48.8 45.4 47.9 L32.5 33.5 Z" fill="url(#kgGold)"/>

  <!-- Heritage Star Dot -->
  <circle cx="44" cy="22" r="1.5" fill="#FFE8A3"/>
</svg>